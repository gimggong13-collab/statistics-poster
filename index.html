<!DOCTYPE html>
<html lang="ko">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    let currentUser = null;

    // 1. Supabase 접속 정보 설정 (정확하고 안전하게 초기화합니다)
    const SUPABASE_URL = "https://sgsnpzkwmhogufzifsvu.supabase.co"; 
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNnc25wemt3bWhvZ3Vmemlmc3Z1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5MzM5OTUsImV4cCI6MjA5NDUwOTk5NX0.Tc4IILKbJUUBEa_UYWdh4RVTiZL8oYaC-XH16iqWsTs"; 
    
    // Supabase 클라이언트 연결 선언
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 💡 제한 없이 누구나 학번, 이름만 입력하면 대시보드로 즉시 입장하는 로그인 함수
    function login() {
        const id = document.getElementById('student-id').value.trim();
        const name = document.getElementById('student-name').value.trim();
        
        if (!id || !name) {
            document.getElementById('login-error').classList.remove('hidden');
            return;
        }
        
        currentUser = { id, name };
        
        // 로그인창 감추고 대시보드 무조건 보여주기
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('dashboard-section').classList.remove('hidden');
        document.getElementById('user-info-display').textContent = `${id} ${name}`;
        
        console.log(`${id} ${name} 학생 입장 완료`);
    }

    function logout() {
        if(confirm("로그아웃 하시겠습니까?")) {
            location.reload();
        }
    }

    // 모달 제어
    function openStep(step) {
        document.getElementById(`modal-${step}`).classList.remove('hidden');
        document.body.style.overflow = 'hidden';
    }
    function closeModal(step) {
        document.getElementById(`modal-${step}`).classList.add('hidden');
        document.body.style.overflow = 'auto';
    }

    // 4-5차시 분석 문항 동적 추가
    function addAnalysisBox(data = null) {
        const container = document.getElementById('analysis-container');
        const div = document.createElement('div');
        div.className = "analysis-box animate-fade-in";
        div.innerHTML = `
            <button onclick="this.parentElement.remove()" class="absolute top-2 right-3 text-slate-300 hover:text-red-500 text-lg">&times;</button>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="md:col-span-1">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-tighter">문항 제목</label>
                    <input type="text" class="w-full text-xs s3-item-title" placeholder="예: 운동 횟수" value="${data ? data.title : ''}">
                </div>
                <div class="md:col-span-2">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-tighter">데이터 요약 (빈도/평균 등)</label>
                    <input type="text" class="w-full text-xs s3-item-value" placeholder="예: 매일(20%), 주3회(45%)..." value="${data ? data.value : ''}">
                </div>
            </div>
        `;
        container.appendChild(div);
    }

    // 글자수 체크
    function updateCharCount(el, targetId, min) {
        const len = el.value.length;
        const target = document.getElementById(targetId);
        target.textContent = `${len} / ${min}자`;
        if (len >= min) {
            target.classList.remove('text-slate-400');
            target.classList.add('text-green-600');
        } else {
            target.classList.remove('text-green-600');
            target.classList.add('text-slate-400');
        }
    }

    // 임시 브라우저 저장 기능 유지
    function getStorageKey() { return `stat_project_${currentUser.id}`; }

    function saveStep(step) {
        const data = JSON.parse(localStorage.getItem(getStorageKey()) || "{}");
        
        if (step === 1) {
            data.s1 = {
                analysis: document.getElementById('s1-graph-analysis').value,
                q_pop: document.getElementById('s1-q-pop').value,
                q_sample: document.getElementById('s1-q-sample').value,
                career: document.getElementById('s1-career').value,
                career_data: document.getElementById('s1-career-data').value,
                questions: Array.from(document.querySelectorAll('.s1-q-item')).map(i => i.value)
            };
        } else if (step === 2) {
            data.s2 = {
                method: document.getElementById('s2-method').value,
                scope: document.getElementById('s2-scope').value,
                link: document.getElementById('s2-link').value,
                details: Array.from(document.querySelectorAll('.s2-question-detail')).map(i => i.value)
            };
        } else if (step === 3) {
            const interpretation = document.getElementById('s3-interpretation').value;
            if(interpretation.length < 150) {
                alert(`결과 해석이 부족합니다. (현재 ${interpretation.length}자 / 최소 150자 필요)`);
                return;
            }
            const items = [];
            document.querySelectorAll('.analysis-box').forEach(box => {
                items.push({
                    title: box.querySelector('.s3-item-title').value,
                    value: box.querySelector('.s3-item-value').value
                });
            });
            data.s3 = {
                items: items,
                canva: document.getElementById('s3-canva-link').value,
                tool: document.getElementById('s3-tool-link').value,
                text: interpretation
            };
        } else if (step === 4) {
            const reflection = document.getElementById('s4-reflection').value;
            if(!document.getElementById('s4-check').checked) { alert("드라이브 업로드 여부를 체크해주세요."); return; }
            if(reflection.length < 150) { 
                alert(`소감문이 부족합니다. (현재 ${reflection.length}자 / 최소 150자 필요)`); 
                return; 
            }
            data.s4 = {
                final_link: document.getElementById('s4-final-link').value,
                reflection: reflection
            };
            localStorage.setItem(getStorageKey(), JSON.stringify(data));
            alert("축하합니다! 모든 활동이 완료되었습니다. 보고서를 출력합니다.");
            window.print();
            return;
        }

        localStorage.setItem(getStorageKey(), JSON.stringify(data));
        alert("저장되었습니다.");
        closeModal(step);
    }

    // === 👑 관리자 시스템 로직 추가 ===
    function openAdminModal() {
        document.getElementById('admin-auth-modal').classList.remove('hidden');
        document.getElementById('admin-password-input').focus();
    }
    function closeAdminModal() {
        document.getElementById('admin-auth-modal').classList.add('hidden');
        document.getElementById('admin-password-input').value = '';
    }

    // 비밀번호 대조를 Supabase 보안 원격 함수에 안전하게 요청
    async function checkAdminPassword() {
        const password = document.getElementById('admin-password-input').value;
        try {
            const { data, error } = await supabase
                .rpc('verify_admin_password', { input_password: password });

            if (error) throw error;

            if (data === true) {
                closeAdminModal();
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('admin-dashboard-section').classList.remove('hidden');
                loadAdminDashboardData();
            } else {
                alert("⚠️ 패스워드가 올바르지 않습니다.");
                document.getElementById('admin-password-input').value = '';
                document.getElementById('admin-password-input').focus();
            }
        } catch (err) {
            alert("인증 오류가 발생했습니다: " + err.message);
        }
    }

    // 학생들의 차시별 제출 데이터 수집 및 테이블 화면 표시
    async function loadAdminDashboardData() {
        const tbody = document.getElementById('admin-table-body');
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-slate-400">데이터를 실시간 동기화 중입니다...</td></tr>`;
        
        try {
            const { data: students, error } = await supabase
                .from('student_data')
                .select('*')
                .order('id', { ascending: true });

            if (error) throw error;

            document.getElementById('admin-student-count').textContent = `참여 학생: ${students.length}명`;
            tbody.innerHTML = '';

            if (students.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-slate-400">등록된 학생 데이터가 없습니다.</td></tr>`;
                return;
            }

            students.forEach(student => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition text-slate-700";
                
                const checkStatus = (stepData) => {
                    return (stepData && Object.keys(stepData).length > 0) 
                        ? `<span class="text-green-500 font-bold">✓ 완료</span>` 
                        : `<span class="text-slate-300">-</span>`;
                };

                tr.innerHTML = `
                    <td class="py-3.5 pl-2 font-mono font-bold">${student.id}</td>
                    <td class="py-3.5 font-semibold text-slate-900">${student.name}</td>
                    <td class="py-3.5 text-center text-xs">${checkStatus(student.s1)}</td>
                    <td class="py-3.5 text-center text-xs">${checkStatus(student.s2)}</td>
                    <td class="py-3.5 text-center text-xs">${checkStatus(student.s3)}</td>
                    <td class="py-3.5 text-center text-xs">${checkStatus(student.s4)}</td>
                    <td class="py-3.5 text-right pr-2">
                        <button onclick='downloadStudentHtml(${JSON.stringify(student)})' class="text-xs bg-blue-50 text-blue-600 hover:bg-blue-100 px-2 py-1 rounded-md font-bold transition">다운로드</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (err) {
            alert("대시보드 로드 실패: " + err.message);
        }
    }

    // 특정 학생 데이터 단일 파일 HTML 보고서 다운로드 기능
    function downloadStudentHtml(student) {
        const formatSection = (title, data) => {
            if (!data || Object.keys(data).length === 0) return `<div class="step-box empty"><h4>${title}</h4><p>제출된 내역이 없습니다.</p></div>`;
            
            let content = '';
            for (const [key, value] of Object.entries(data)) {
                if (Array.isArray(value)) {
                    content += `<p><strong>• ${key}:</strong></p><ul>${value.map(v => `<li>${v || '-'}</li>`).join('')}</ul>`;
                } else if (typeof value === 'object' && value !== null) {
                    content += `<p><strong>• ${key}:</strong> ${JSON.stringify(value)}</p>`;
                } else {
                    content += `<p><strong>• ${key}:</strong> ${value || '-'}</p>`;
                }
            }
            return `<div class="step-box"><h4>${title}</h4>${content}</div>`;
        };

        const htmlContent = `
        <!DOCTYPE html>
        <html lang="ko">
        <head>
            <meta charset="UTF-8">
            <title>[보고서] ${student.id}_${student.name}</title>
            <style>
                body { font-family: sans-serif; padding: 40px; color: #333; line-height: 1.6; background: #fafafa; }
                .report-card { max-width: 800px; margin: 0 auto; background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
                h2 { margin-top: 0; color: #111; border-bottom: 2px solid #111; padding-bottom: 10px; }
                .info { margin-bottom: 30px; font-size: 1.1em; color: #555; }
                .step-box { background: #f8fafc; border-left: 4px solid #3b82f6; padding: 20px; margin-bottom: 20px; border-radius: 0 8px 8px 0; }
                .step-box.empty { border-left-color: #cbd5e1; color: #94a3b8; }
                h4 { margin-top: 0; margin-bottom: 10px; color: #1e3a8a; font-size: 1.15em; }
                ul { padding-left: 20px; margin: 5px 0; }
                strong { color: #475569; }
            </style>
        </head>
        <body>
            <div class="report-card">
                <h2>📊 생활 속 통계 포스터 프로젝트 종합 보고서</h2>
                <div class="info"><strong>학번 :</strong> ${student.id} &nbsp;&nbsp;|&nbsp;&nbsp; <strong>성명 :</strong> ${student.name}</div>
                ${formatSection('1차시: 주제 및 탐구 문제', student.s1)}
                ${formatSection('2~3차시: 자료 수집 및 설계', student.s2)}
                ${formatSection('4~5차시: 분석 및 시각화', student.s3)}
                ${formatSection('6차시: 최종 제출 및 소감', student.s4)}
            </div>
        </body>
        </html>`;

        const blob = new Blob([htmlContent], { type: 'text/html' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `보고서_${student.id}_${student.name}.html`;
        link.click();
        URL.revokeObjectURL(link.href);
    }
</script>
            </html>`;

            const blob = new Blob([htmlContent], { type: 'text/html' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `보고서_${student.id}_${student.name}.html`;
            link.click();
            URL.revokeObjectURL(link.href);
        }
    </script>
