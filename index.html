<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 생활 속 통계 포스터 프로젝트 통합 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="min-h-screen text-slate-800 pb-10">

    <div id="app" class="max-w-5xl mx-auto px-4 py-8">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-black text-slate-900 mb-2">📊 생활 속 통계 포스터 제작하기</h1>
            <p class="text-slate-500 font-medium">1차시부터 최종 제출까지 원스톱 관리 시스템</p>
        </header>

        <section id="login-section" class="max-w-md mx-auto glass-card p-8 rounded-3xl shadow-2xl border border-white">
            <h2 class="text-xl font-bold mb-6 text-center text-slate-700">학생 본인 확인</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">학번 (5자리, 예: 10101)</label>
                    <input type="text" id="student-id" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition bg-slate-50" placeholder="학번을 입력하세요">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">이름</label>
                    <input type="text" id="student-name" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition bg-slate-50" placeholder="이름을 입력하세요">
                </div>
                <button onclick="handleLogin()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition shadow-lg">입장하기</button>
            </div>
            <div class="mt-6 text-center">
                <button onclick="checkAdmin()" class="text-xs text-slate-400 hover:underline">관리자 모드</button>
            </div>
        </section>

        <section id="dashboard-section" class="hidden space-y-6">
            <div class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></span>
                    <span class="text-slate-700 font-bold" id="user-info-display"></span> 학생 환영합니다!
                </div>
                <button onclick="handleLogout()" class="text-sm text-slate-400 hover:text-red-500 font-medium">로그아웃</button>
            </div>

            <div class="flex flex-wrap gap-2 border-b pb-3">
                <button onclick="switchTab(1)" id="tab-btn-1" class="px-4 py-2 rounded-xl font-bold text-sm bg-indigo-600 text-white shadow">1차시 (주제 설정)</button>
                <button onclick="switchTab(2)" id="tab-btn-2" class="px-4 py-2 rounded-xl font-bold text-sm bg-white text-slate-600 border">2~3차시 (자료 수집)</button>
                <button onclick="switchTab(3)" id="tab-btn-3" class="px-4 py-2 rounded-xl font-bold text-sm bg-white text-slate-600 border">4~5차시 (자료 분석)</button>
                <button onclick="switchTab(4)" id="tab-btn-4" class="px-4 py-2 rounded-xl font-bold text-sm bg-white text-slate-600 border">6차시 (최종 제출)</button>
            </div>

            <div id="tab-1" class="tab-content active bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                <h3 class="text-xl font-bold text-slate-900 border-l-4 border-blue-500 pl-2">1차시: 주제 및 탐구 문제 설정하기</h3>
                <div>
                    <label class="block text-sm font-semibold mb-1">Q1. 왜곡된 통계 그래프를 보고 느낀 점은 무엇인가요?</label>
                    <textarea id="step1_ans" class="w-full p-3 border rounded-xl h-24" placeholder="내용을 입력하세요..."></textarea>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1">모집단 (전체 대상 집단)</label>
                        <input type="text" id="step2_1" class="w-full p-3 border rounded-xl">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">표본 (조사를 위해 뽑은 대상)</label>
                        <input type="text" id="step2_2" class="w-full p-3 border rounded-xl">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">관심 진로 및 요약 데이터</label>
                    <input type="text" id="step3_career" class="w-full p-3 border rounded-xl mb-2" placeholder="관심 진로 분야">
                    <textarea id="step3_data" class="w-full p-3 border rounded-xl h-24" placeholder="관련 데이터 요약"></textarea>
                </div>
                <button onclick="saveData(1)" class="bg-blue-600 text-white px-6 py-2.5 rounded-xl font-bold hover:bg-blue-700 transition">1차시 중간 저장</button>
            </div>

            <div id="tab-2" class="tab-content bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                <h3 class="text-xl font-bold text-slate-900 border-l-4 border-green-500 pl-2">2~3차시: 자료 수집 및 설계</h3>
                <div>
                    <label class="block text-sm font-semibold mb-1">자료 수집 방법 (예: 구글 폼, 네이버 오피스 등)</label>
                    <input type="text" id="step2_method" class="w-full p-3 border rounded-xl">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">조사 범위 및 대상</label>
                    <input type="text" id="step2_scope" class="w-full p-3 border rounded-xl">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">💻 온라인 설문지 링크 (URL)</label>
                    <input type="url" id="step2_survey_link" class="w-full p-3 border rounded-xl text-blue-600 font-mono" placeholder="https://...">
                </div>
                <button onclick="saveData(2)" class="bg-green-600 text-white px-6 py-2.5 rounded-xl font-bold hover:bg-green-700 transition">2~3차시 중간 저장</button>
            </div>

            <div id="tab-3" class="tab-content bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                <h3 class="text-xl font-bold text-slate-900 border-l-4 border-purple-500 pl-2">4~5차시: 자료 분석 및 그래프 시각화</h3>
                <div>
                    <label class="block text-sm font-semibold mb-1">🖼 캔바(Canva)로 정리한 그래프 링크</label>
                    <input type="url" id="step4_canva_link" class="w-full p-3 border rounded-xl text-purple-600 font-mono" placeholder="https://canva.com/...">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">⚙ 공학도구 결과 링크 (선택)</label>
                    <input type="url" id="step4_tool_link" class="w-full p-3 border rounded-xl text-slate-600 font-mono" placeholder="https://...">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">✍ 통계 결과 해석 (최소 150자 이상 권장)</label>
                    <textarea id="step4_interpretation" class="w-full p-3 border rounded-xl h-32" placeholder="그래프 결과 분석 및 결론 도출 문장을 작성해 주세요."></textarea>
                </div>
                <button onclick="saveData(3)" class="bg-purple-600 text-white px-6 py-2.5 rounded-xl font-bold hover:bg-purple-700 transition">4~5차시 중간 저장</button>
            </div>

            <div id="tab-4" class="tab-content bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-6">
                <h3 class="text-xl font-bold text-slate-900 border-l-4 border-indigo-500 pl-2">6차시: 최종 프로젝트 제출</h3>
                <div class="bg-indigo-50 p-4 rounded-xl text-sm text-indigo-800 font-medium">
                    💡 모든 차시 내용이 임베딩된 클라우드 데이터 전송 상태를 최종 승인합니다. 제출 완료 후에는 내용 인쇄가 가능합니다.
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">✨ 프로젝트 수행 최종 소감문</label>
                    <textarea id="step6_reflection" class="w-full p-3 border rounded-xl h-32" placeholder="통계 포스터 프로젝트를 마무리하며 배운 점과 소감을 입력하세요."></textarea>
                </div>
                <div class="flex gap-2">
                    <button onclick="submitFinalProject()" class="flex-1 bg-indigo-600 text-white py-3 rounded-xl font-bold text-lg hover:bg-indigo-700 transition shadow-lg">🚀 최종 완료 처리 및 서버 전송</button>
                    <button onclick="window.print()" class="bg-slate-800 text-white px-6 py-3 rounded-xl font-bold hover:bg-slate-900 transition">🖨 포스터/인쇄 출력</button>
                </div>
            </div>
        </section>

        <section id="admin-section" class="hidden space-y-4 mt-10 p-6 bg-slate-900 text-white rounded-2xl">
            <h2 class="text-xl font-bold">🛠 실시간 교사 관리 패널</h2>
            <button onclick="loadAllStudents()" class="bg-indigo-500 text-white px-4 py-2 rounded-lg text-xs font-bold">학생 제출 현황 새로고침</button>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs mt-2 text-slate-300">
                    <thead>
                        <tr class="border-b border-slate-700 text-slate-400">
                            <th class="p-2">학번</th><th class="p-2">이름</th><th class="p-2">1차시</th><th class="p-2">설문링크</th><th class="p-2">캔바링크</th><th class="p-2">최종제출</th>
                        </tr>
                    </thead>
                    <tbody id="admin-student-list"></tbody>
                </table>
            </div>
            <button onclick="document.getElementById('admin-section').classList.add('hidden')" class="text-sm underline text-slate-400">닫기</button>
        </section>
    </div>

    <script>
        // --- 3단계: Supabase 인스턴스 초기화 주소 설정 ---
        // 본인의 Supabase Project API 정보로 변경 필수
        const SUPABASE_URL = 'https://YOUR_PROJECT_ID.supabase.co';
        const SUPABASE_ANON_KEY = 'YOUR_ANON_PUBLIC_KEY';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentStudentId = "";
        let currentStudentName = "";

        // 로그인 처리 (DB 동적 조회 및 자동 생성 허용 방식)
        async function handleLogin() {
            const id = document.getElementById('student-id').value.trim();
            const name = document.getElementById('student-name').value.trim();

            if(!id || !name) { alert("학번과 이름을 모두 입력하세요."); return; }

            // DB에서 해당 학번 조회 시도
            let { data: student, error } = await _supabase
                .from('student_posters')
                .select('*')
                .eq('student_id', id)
                .maybeSingle();

            if (error) { alert("데이터베이스 통신 오류"); return; }

            // 해당 학번의 레코드가 없으면 새롭게 생성 (최초 로그인 등록)
            if(!student) {
                const { data: newStudent, error: insErr } = await _supabase
                    .from('student_posters')
                    .insert([{ student_id: id, student_name: name }])
                    .select()
                    .single();
                
                if(insErr) { alert("등록 실패"); return; }
                student = newStudent;
            }

            currentStudentId = id;
            currentStudentName = name;

            // 기존 입력 데이터 뷰 매핑
            document.getElementById('step1_ans').value = student.step1_ans || "";
            document.getElementById('step2_1').value = student.step2_1 || "";
            document.getElementById('step2_2').value = student.step2_2 || "";
            document.getElementById('step3_career').value = student.step3_career || "";
            document.getElementById('step3_data').value = student.step3_data || "";
            document.getElementById('step2_method').value = student.step2_method || "";
            document.getElementById('step2_scope').value = student.step2_scope || "";
            document.getElementById('step2_survey_link').value = student.step2_survey_link || "";
            document.getElementById('step4_canva_link').value = student.step4_canva_link || "";
            document.getElementById('step4_tool_link').value = student.step4_tool_link || "";
            document.getElementById('step4_interpretation').value = student.step4_interpretation || "";
            document.getElementById('step6_reflection').value = student.step6_reflection || "";

            document.getElementById('user-info-display').innerText = `${id} ${name}`;
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
        }

        // 데이터 통합 저장 모듈
        async function saveData(stepNum) {
            if(!currentStudentId) return;

            const updateData = {
                step1_ans: document.getElementById('step1_ans').value,
                step2_1: document.getElementById('step2_1').value,
                step2_2: document.getElementById('step2_2').value,
                step3_career: document.getElementById('step3_career').value,
                step3_data: document.getElementById('step3_data').value,
                step2_method: document.getElementById('step2_method').value,
                step2_scope: document.getElementById('step2_scope').value,
                step2_survey_link: document.getElementById('step2_survey_link').value,
                step4_canva_link: document.getElementById('step4_canva_link').value,
                step4_tool_link: document.getElementById('step4_tool_link').value,
                step4_interpretation: document.getElementById('step4_interpretation').value,
                step6_reflection: document.getElementById('step6_reflection').value,
                updated_at: new Date().toISOString()
            };

            const { error } = await _supabase
                .from('student_posters')
                .update(updateData)
                .eq('student_id', currentStudentId);

            if(error) {
                alert("저장 중 문제가 발생했습니다: " + error.message);
            } else {
                alert(`${stepNum}차시 내용이 실시간 클라우드 DB에 동기화되었습니다.`);
            }
        }

        // 최종 제출 실행
        async function submitFinalProject() {
            if(confirm("최종 완료처리 후 제출하시겠습니까? 데이터가 박제됩니다.")) {
                const { error } = await _supabase
                    .from('student_posters')
                    .update({ step6_submitted: true, updated_at: new Date().toISOString() })
                    .eq('student_id', currentStudentId);

                if(!error) { alert("🎉 프로젝트가 최종 성공적으로 제출되었습니다!"); }
            }
        }

        // 탭 스위칭 매커니즘
        function switchTab(tabNum) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tabNum}`).classList.add('active');

            for(let i=1; i<=4; i++) {
                const btn = document.getElementById(`tab-btn-${i}`);
                if(i === tabNum) {
                    btn.className = "px-4 py-2 rounded-xl font-bold text-sm bg-indigo-600 text-white shadow";
                } else {
                    btn.className = "px-4 py-2 rounded-xl font-bold text-sm bg-white text-slate-600 border";
                }
            }
        }

        // 교사용 실시간 대시보드 불러오기
        async function loadAllStudents() {
            const { data, error } = await _supabase.from('student_posters').select('*').order('student_id');
            if(error) return;
            
            const tbody = document.getElementById('admin-student-list');
            tbody.innerHTML = "";
            data.forEach(s => {
                tbody.innerHTML += `
                    <tr class="border-b border-slate-800">
                        <td class="p-2">${s.student_id}</td>
                        <td class="p-2 font-bold">${s.student_name}</td>
                        <td class="p-2">${s.step3_career ? '✅ 작성중' : '❌ 미작성'}</td>
                        <td class="p-2">${s.step2_survey_link ? `<a href="${s.step2_survey_link}" target="_blank" class="text-blue-400 underline">링크</a>` : '-'}</td>
                        <td class="p-2">${s.step4_canva_link ? `<a href="${s.step4_canva_link}" target="_blank" class="text-purple-400 underline">그래프</a>` : '-'}</td>
                        <td class="p-2">${s.step6_submitted ? '<span class="text-green-400">● 완료</span>' : '<span class="text-amber-400">○ 진행중</span>'}</td>
                    </tr>
                `;
            });
        }

        function checkAdmin() {
            if(prompt("관리자 비밀번호를 입력하세요:") === "teacher123") {
                document.getElementById('admin-section').classList.remove('hidden');
                loadAllStudents();
            }
        }

        function handleLogout() { location.reload(); }
    </script>
</body>
</html>
